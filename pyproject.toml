[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-terminal"
version = "0.1.1"
description = "Real-time MPRIS terminal karaoke with honest word timing"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Es1xx"}]
requires-python = ">=3.12"
dependencies = [
  "textual>=1.0,<9", "rich>=13.9,<15", "dbus-next>=0.2.3,<0.3",
  "httpx>=0.27,<1", "rapidfuzz>=3.9,<4", "platformdirs>=4.3,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9"]

[project.scripts]
lyra = "lyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
